name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"  # nightly — runs the (slow) mutation gate
  workflow_dispatch: {}

jobs:
  # M6 — strict test-validity gate. FAILS on a red suite: the suite is green
  # (5 known reds are xfail-annotated) and the vacuity/mutation-config/no-shadow
  # guards run here too. The `build` job below also runs strict, across the
  # supported 3.11/3.12 matrix (matches pyproject requires-python >= 3.11).
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test suite (strict — fails on any unexpected failure)
        run: pytest -q
      - name: Vacuity gate (no new assertion-free tests)
        run: python quality_gates.py vacuity || (echo "New vacuous test(s) — see test_m6b1_no_new_vacuous_tests" && exit 1)

  # M6.A — mutation gate. Expensive (runs the suite per mutant), so scheduled /
  # manual only. Fails the run if any core function drops below its score floor.
  mutation-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run mutation gate
        run: python quality_gates.py mutation

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Quoted so YAML doesn't read 3.10 as the float 3.1. Matches
        # requires-python >= 3.11; 3.12 is the primary dev/runtime version.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax check (compile all .py)
        run: python -m compileall .

      - name: Run tests
        run: pytest -q
