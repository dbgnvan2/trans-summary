[project]
name = "trans-summary"
version = "0.1.0"
description = "Automated transcript summarization and processing pipeline."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies — the single source of truth so `pip install .` yields a
# working install. Kept in sync with requirements.txt (which pins exact versions
# for reproducible CI/dev installs); these are the compatible floors (review H4).
dependencies = [
    "anthropic>=0.75.0",
    "beautifulsoup4>=4.12.3",
    "jsonschema>=4.26.0",
    "Jinja2>=3.1.4",
    "markdown-it-py>=3.0.0",
    "pdfminer.six>=20250506",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
    "weasyprint>=67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "PyYAML>=6.0.2",  # imported by tests/test_overview_post.py
    "ruff>=0.14.10",
]

# --- Ruff Configuration ---
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.setuptools.packages.find]
exclude = [
    "logs*",
    "test1*",
    "source*",
    "skills*",
    "prompts*",
    "oldfiles*",
    "projects*",
    "templates*",
    "tests*"
]